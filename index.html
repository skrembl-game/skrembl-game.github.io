---
<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.game_name }}</title>
<meta name="description" content="SKREMBL – slovní hra s přeskládáváním písmen. / A word game where you rearrange letter tiles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f1e6; --card:#fffdf6; --fg:#24301f; --muted:#5f6b57; --line:#ddd5bf; --accent:#2f7a3a; --accent-fg:#ffffff; --wood:#9a6435; --wood-dark:#6d4322; --tile:#f6e3b8; --tile-fg:#4a2e14; --leaf:#4f9a45; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121a12; --card:#1a241a; --fg:#ecf1e4; --muted:#a9b79f; --line:#2e3b2c; --accent:#7cc76f; --accent-fg:#10210f; --wood:#7b4f2a; --wood-dark:#4f3119; --tile:#e9d3a2; --tile-fg:#3e2610; --leaf:#5fae52; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .top { background:linear-gradient(180deg, #1f4d27 0%, #2f6b33 55%, #3d7d3a 100%); padding:40px 16px 34px; text-align:center; border-bottom:8px solid var(--wood); box-shadow:inset 0 -3px 0 var(--wood-dark); }
  .logo { display:inline-flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:0; padding:0; list-style:none; }
  .logo span { display:grid; place-items:center; width:46px; height:52px; border-radius:10px; background:var(--tile); color:var(--tile-fg); font:600 30px/1 "Fredoka", sans-serif; box-shadow:0 4px 0 var(--wood-dark), 0 6px 12px rgba(0,0,0,.25); }
  .logo span:nth-child(odd) { transform:rotate(-3deg); }
  .logo span:nth-child(even) { transform:rotate(2deg) translateY(2px); }
  .tagline { color:#e7f3dc; margin:18px 0 0; font-weight:600; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  .links { display:grid; gap:14px; margin:0; padding:0; list-style:none; }
  .links a { display:block; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--leaf); border-radius:12px; padding:16px 18px; color:var(--fg); text-decoration:none; font-weight:700; }
  .links a small { display:block; color:var(--muted); font-weight:400; }
  .links a:hover, .links a:focus-visible { border-color:var(--accent); outline:none; }
  footer { color:var(--muted); font-size:14px; text-align:center; padding:0 16px 32px; }
  footer a { color:var(--accent); }
  @media (max-width:380px) { .logo span { width:38px; height:44px; font-size:25px; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="logo" aria-label="SKREMBL"><span>S</span><span>K</span><span>R</span><span>E</span><span>M</span><span>B</span><span>L</span></h1>
  <p class="tagline">Přeskládej písmena ve slova · Unscramble the letters into words</p>
</header>
<main>
  <ul class="links">
    <li><a href="privacy/">Zásady ochrany soukromí <small>Privacy Policy</small></a></li>
    <li><a href="support/">Podpora a časté dotazy <small>Support &amp; FAQ</small></a></li>
  </ul>
</main>
<footer>Kontakt / Contact: <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></footer>
</body>
</html>
